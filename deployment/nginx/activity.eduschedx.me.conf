server {
    listen 80;
    listen [::]:80;
    server_name activity.eduschedx.me;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name activity.eduschedx.me;

    root /var/www/eduschedx-security-activity;
    index index.php;

    ssl_certificate /etc/letsencrypt/live/activity.eduschedx.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/activity.eduschedx.me/privkey.pem;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /storage/ { deny all; }
    location ^~ /deployment/ { deny all; }
    location ^~ /instructor-materials/ { deny all; }
    location = /config.php { deny all; }

    # The hosted admin wrappers require these existing visual assets only.
    location = /instructor-server/style.css { try_files $uri =404; }
    location = /instructor-server/admin/admin.js { try_files $uri =404; }
    location ^~ /instructor-server/images/ { try_files $uri =404; }
    location ^~ /instructor-server/ { deny all; }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/eduschedx-activity.sock;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
}
